[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cuda_translator"
version = "0.1.0"
description = "Cross-Architecture GPU Translation Layer for CUDA to AMD ROCm and Vulkan Compute"
readme = "README.md"
authors = [{ name = "CUDA_Translator Team" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "rich>=12.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov",
]

[project.scripts]
cuda-translator = "cuda_translator.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
